        const facilityTypes = [
            { id: '공원', icon: '🌳', label: '공원', default: 2.5 },
            { id: '도서관', icon: '📚', label: '도서관', default: 3.5 },
            { id: '문화공간', icon: '🏛️', label: '문화공간', default: 2.0 },
            { id: '영화관', icon: '🎬', label: '영화관', default: 3.0 },
            { id: '체육시설', icon: '⚽', label: '체육시설', default: 4.0 }
        ];

        let currentWeights = {};
        facilityTypes.forEach(f => currentWeights[f.id] = f.default);
        let currentMode = 'abs'; // 'abs' or 'cap'

        // Initialize UI
        const sliderContainer = document.getElementById('weight-sliders');
        facilityTypes.forEach(f => {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-bold text-slate-700">${f.icon} ${f.label}</span>
                    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded" id="val-${f.id}">${f.default}</span>
                </div>
                <input type="range" min="0" max="5" step="0.5" value="${f.default}" id="slider-${f.id}">
            `;
            sliderContainer.appendChild(div);
            
            document.getElementById(`slider-${f.id}`).addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                currentWeights[f.id] = val;
                document.getElementById(`val-${f.id}`).innerText = val.toFixed(1);
                updateDashboard();
            });
        });

        document.querySelectorAll('input[name="mode"]').forEach(r => {
            r.addEventListener('change', (e) => {
                currentMode = e.target.value;
                document.getElementById('current-mode-text').innerText = 
                    (currentMode === 'abs' ? '절대 시설 수 기준' : '인구 대비 인프라 기준') + 
                    ' 사용자의 선호도에 따른 실시간 주거 입지 분석';
                updateDashboard();
            });
        });

        // Charts
        let mapChart = echarts.init(document.getElementById('map-chart'));
        let rankChart = echarts.init(document.getElementById('rank-chart'));

        async function init() {
            const geoRes = await fetch('https://raw.githubusercontent.com/southkorea/seoul-maps/master/kostat/2013/json/seoul_municipalities_geo_simple.json');
            const geoJson = await geoRes.json();
            echarts.registerMap('seoul', geoJson);
            updateDashboard();
        }

        function updateDashboard() {
            // 1. Calculate Scores
            const dataWithScores = rawData.map(d => {
                let score = 0;
                let totalW = 0;
                facilityTypes.forEach(f => {
                    const col = currentMode === 'abs' ? f.id : `${f.id}_1만명당`;
                    const maxVal = Math.max(...rawData.map(x => x[col])) || 1;
                    const norm = d[col] / maxVal;
                    score += norm * currentWeights[f.id];
                    totalW += currentWeights[f.id];
                });
                const finalScore = totalW > 0 ? (score / totalW * 100).toFixed(1) : 0;
                return { ...d, score: parseFloat(finalScore) };
            });

            // 2. Update KPIs
            const kpiSection = document.getElementById('kpi-section');
            kpiSection.innerHTML = '';
            facilityTypes.forEach(f => {
                const total = rawData.reduce((s, x) => s + x[f.id], 0);
                kpiSection.innerHTML += `
                    <div class="bento-card">
                        <p class="text-xs font-bold text-slate-400 mb-1">${f.icon} ${f.label}</p>
                        <p class="text-xl font-black text-slate-800">${total.toLocaleString()}개</p>
                    </div>
                `;
            });
            const totalPop = rawData.reduce((s, x) => s + x['30대인구'], 0);
            kpiSection.innerHTML += `
                <div class="bento-card">
                    <p class="text-xs font-bold text-slate-400 mb-1">👥 30대 인구</p>
                    <p class="text-xl font-black text-slate-800">${Math.round(totalPop).toLocaleString()}명</p>
                </div>
            `;

            // 3. Update Map
            const highImportance = {};
            facilityTypes.forEach(f => highImportance[f.id] = currentWeights[f.id] >= 3.5);

            mapChart.setOption({
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(255,255,255,0.98)',
                    padding: 16, borderRadius: 12, borderWidth: 0, shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.1)',
                    formatter: (p) => {
                        if(!p.data) return p.name;
                        const d = p.data.origin;
                        const getS = (k) => highImportance[k] ? 'font-weight:700; color:#ef4444; background:#fef2f2; padding:1px 4px; border-radius:3px;' : 'color:#64748b;';
                        return `
                            <div class="font-bold text-lg mb-2">${d.자치구}</div>
                            <div class="text-blue-600 font-bold mb-1 text-sm">⭐ 추천 점수: ${p.data.value}점</div>
                            <div class="text-slate-400 text-xs mb-3">👥 30대 인구: ${Math.round(d['30대인구']).toLocaleString()}명</div>
                            <hr class="mb-3">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:11px;">
                                <div style="${getS('공원')}">🌳 공원: ${d.공원}</div>
                                <div style="${getS('도서관')}">📚 도서관: ${d.도서관}</div>
                                <div style="${getS('문화공간')}">🎭 문화: ${d.문화공간}</div>
                                <div style="${getS('영화관')}">🎬 영화: ${d.영화관}</div>
                                <div style="${getS('체육시설')}">⚽ 체육: ${d.체육시설}</div>
                            </div>
                        `;
                    }
                },
                visualMap: {
                    min: Math.min(...dataWithScores.map(d => d.score)),
                    max: Math.max(...dataWithScores.map(d => d.score)),
                    inRange: { color: ['#eff6ff', '#3b82f6', '#1e3a8a'] },
                    show: false
                },
                series: [{
                    type: 'map', map: 'seoul',
                    label: { show: true, fontSize: 10, color: '#475569' },
                    itemStyle: { borderColor: '#fff', borderWidth: 1 },
                    emphasis: { itemStyle: { areaColor: '#dbeafe' }, label: { color: '#1e3a8a', fontWeight: 'bold' } },
                    data: dataWithScores.map(d => ({ name: d.자치구, value: d.score, origin: d }))
                }]
            });

            // 4. Update Bar Chart
            const sorted = [...dataWithScores].sort((a, b) => a.score - b.score).slice(-10);
            rankChart.setOption({
                grid: { left: '15%', right: '10%', top: '2%', bottom: '5%' },
                xAxis: { type: 'value', show: false },
                yAxis: { type: 'category', data: sorted.map(d => d.자치구), axisLine: { show: false }, axisTick: { show: false } },
                series: [{
                    type: 'bar', data: sorted.map(d => d.score),
                    label: { show: true, position: 'right', formatter: '{c}점' },
                    itemStyle: { color: '#3b82f6', borderRadius: [0, 6, 6, 0] }
                }]
            });

            // 5. Update Recommendation Cards
            const top3 = [...dataWithScores].sort((a, b) => b.score - a.score).slice(0, 3);
            const cardsContainer = document.getElementById('recommend-cards');
            cardsContainer.innerHTML = '';
            
            top3.forEach((d, i) => {
                const { reasons, tags } = getRecommendationContent(d, dataWithScores);
                const card = document.createElement('div');
                card.className = 'recommend-card';
                card.innerHTML = `
                    <div class="rank-badge">${i+1}위 추천</div>
                    <div class="text-2xl font-black text-slate-800 mb-1">${d.자치구}</div>
                    <div class="text-blue-600 font-bold text-lg mb-4">총점 ${d.score}점</div>
                    <hr class="mb-5 border-slate-100">
                    
                    <p class="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">📊 시설별 지표</p>
                    <div class="space-y-3 mb-6">
                        ${facilityTypes.map(f => {
                            const val = currentMode === 'abs' ? d[f.id] : d[`${f.id}_1만명당`];
                            const maxVal = Math.max(...dataWithScores.map(x => currentMode === 'abs' ? x[f.id] : x[`${f.id}_1만명당`])) || 1;
                            const pct = Math.min(val / maxVal * 100, 100);
                            return `
                                <div>
                                    <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                                        <span>${f.icon} ${f.label}</span>
                                        <span>${val.toFixed(1)}</span>
                                    </div>
                                    <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-blue-500 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">✅ 추천 이유</p>
                    <ul class="text-sm text-slate-600 space-y-2 mb-6">
                        ${reasons.map(r => `<li class="flex items-start gap-2"><span>•</span><span>${r}</span></li>`).join('')}
                    </ul>

                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">🎨 라이프스타일</p>
                    <div>
                        ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        function getRecommendationContent(row, allData) {
            const reasons = [];
            const tags = [];
            
            facilityTypes.forEach(f => {
                const col = currentMode === 'abs' ? f.id : `${f.id}_1만명당`;
                const sortedVals = allData.map(x => x[col]).sort((a, b) => b - a);
                const topVal = sortedVals[4]; // Top 5 threshold
                
                if (row[col] >= topVal) {
                    if (f.id === '영화관') reasons.push('🎬 문화·영상 콘텐츠 접근성이 서울 최상위권입니다.');
                    else if (f.id === '공원') reasons.push('🌳 도심 속 대형 공원과 녹지 접근성이 매우 우수합니다.');
                    else if (f.id === '도서관') reasons.push('📚 자기계발을 위한 도서관 인프라가 풍부합니다.');
                    else if (f.id === '체육시설') reasons.push('⚽ 다양한 스포츠 시설이 밀집되어 활동적입니다.');
                    else if (f.id === '문화공간') reasons.push('🏛️ 전시, 공연 등 예술 향유 기회가 풍부합니다.');
                }
            });

            const avgDiv = allData.reduce((s, x) => s + x.다양성지수, 0) / allData.length;
            if (row.다양성지수 > avgDiv) reasons.push('⚖️ 생활 인프라가 특정 시설에 치우치지 않고 균형적입니다.');
            
            if (reasons.length < 2) reasons.push('🏙️ 30대 선호 핵심 인프라를 고르게 갖춘 지역입니다.');

            if (row.영화관 > 10 || row.문화공간 > 30) tags.push('#문화생활_중심');
            if (row.공원 > 5 || row.체육시설 > 15) tags.push('#활동적_여가');
            if (row.도서관 > 20) tags.push('#자기계발_지향');
            if (row.다양성지수 > 1.45) tags.push('#올라운드_거주');
            
            return { reasons: reasons.slice(0, 3), tags: tags.length ? tags.slice(0, 3) : ['#안정적_주거지'] };
        }

        window.addEventListener('resize', () => {
            mapChart.resize();
            rankChart.resize();
        });

        init();
    </script>
</body>
</html>
